# XcodeGen yapılandırması (YEDEK).
#
# Depodaki TUZ.xcodeproj elle yazılmış ve Xcode 16 "file system synchronized
# groups" kullanır; doğrudan açılabilir. Eğer proje dosyasında bir sorun olursa
# ya da projeyi sıfırdan üretmek istersen:
#
#   brew install xcodegen
#   xcodegen generate
#
# komutu bu dosyadan birebir aynı projeyi yeniden üretir.

name: TUZ
options:
  bundleIdPrefix: com.tuzailesi
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  TUZ:
    type: application
    platform: iOS
    sources:
      - path: TUZ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tuzailesi.TUZ
        INFOPLIST_KEY_CFBundleDisplayName: "TÜZ"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
